[profile.default]
src = "src"
test = "test"
out = "out"
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/contracts/=../server/node_modules/@openzeppelin/contracts/"]
allow_paths = ["../server/node_modules"]

[fuzz]
runs = 256
