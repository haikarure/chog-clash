<!doctype html><html lang="en"><head><meta charset="utf-8"><base href="../"><title>CHOG art workshop</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#271436;color:#fff2cf;font:15px 'Trebuchet MS',sans-serif}h1{font-size:38px;color:#d8a0f2}h2{color:#d1ed81}main{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{background:#3a234b;border:2px solid #76538b;border-radius:16px;padding:12px}article img{width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:10px}article small{display:block;padding-top:8px}.effects{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.effects figure{margin:0;padding:10px;background:#4e345f;border-radius:12px;width:140px}.effects img{width:120px;height:120px;object-fit:contain}.effects figcaption{font-size:12px;text-align:center}.fighters img{aspect-ratio:1;object-fit:contain}a{color:#dfb8f3}
</style></head><body><h1>CHOG CLASH / ART WORKSHOP</h1><p>Five generated arenas · editable CHOG rigs · original effects and audio.</p><h2>MOTION COMIC</h2><main id="comic-art"></main><h2>WORLD</h2><main id="arenas"></main><h2>FIGHTERS</h2><main class="fighters" id="fighters"></main><h2>COMBAT STICKERS</h2><div class="effects" id="effects"></div><h2>HOUSE CUP GROOVE</h2><audio controls src="assets/chog/audio/house-cup-groove.mp3"></audio><script src="chog-roster.js"></script><script src="match.js"></script><script src="tools/chog-effects.js"></script><script>
document.getElementById('comic-art').innerHTML=['comic-city','comic-heroes','comic-spark','comic-showdown'].map(id=>`<article><img src="assets/chog/landing/${id}.webp" alt="${id}"><small>${id}</small></article>`).join('');
arenas.innerHTML=Object.entries(MatchRules.stages).map(([id,s])=>`<article><img src="${s.image}" alt="${s.name}"><small>${s.name}</small></article>`).join('');
fighters.innerHTML=CHOG.characters.map(c=>`<article><img src="${c.portrait}" alt="${c.name}"><small>${c.displayName} · ${c.title}</small></article>`).join('');
effects.innerHTML=Object.entries(ChogEffects.sets).flatMap(([id,set])=>Object.keys(set).map(name=>`<figure><img src="assets/chog/fighters/${id}/ui/fx-${name}.webp" alt=""><figcaption>${id} / ${set[name]}</figcaption></figure>`)).join('');
</script></body></html>
